<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ room.name }}</title>
  </head>
  <body>
    <h1>{{ room.name }}</h1>
    <textarea id="chat-log" cols="100" rows="20" readonly>{% for message in messages %}{{ message.content }}
{% endfor %}</textarea><br>
    <input id="chat-message-input" type="text" size="100">
    <input id="chat-message-submit" type="button" value="Send">
    {{ room_name|json_script:"room-name" }}
    <script>
      const roomName = JSON.parse(document.getElementById("room-name").textContent);
      const protocol = window.location.protocol === "https:" ? "wss" : "ws";
      const chatSocket = new WebSocket(`${protocol}://${window.location.host}/ws/chat/${roomName}/`);
      chatSocket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        document.querySelector("#chat-log").value += `${data.message}\n`;
      };
      const sendMessage = () => {
        const input = document.querySelector("#chat-message-input");
        if (input.value.trim()) {
          chatSocket.send(JSON.stringify({ message: input.value }));
          input.value = "";
        }
      };
      document.querySelector("#chat-message-input").focus();
      document.querySelector("#chat-message-input").addEventListener("keyup", (event) => {
        if (event.key === "Enter") sendMessage();
      });
      document.querySelector("#chat-message-submit").onclick = sendMessage;
    </script>
  </body>
</html>
