[project]
name = "locallibrary"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "channels[daphne]>=4.3.2",
    "channels-redis>=4.3.0",
    "django>=6.1.1",
    "django-allauth>=65.11.2",
    "django-environ>=0.14.0",
    "django-ninja>=1.7.1",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pylint-django>=2.8.0",
]
prod = [
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
]
